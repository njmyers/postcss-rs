[package]
edition = "2021"
license = "MIT"
name = "postcss-rs-tokenizer"
version = "0.1.0"

[dependencies]
itertools = "0.13"

[dependencies.serde]
features = ["derive", "rc"]
version = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
indoc = "1.0"

[[bench]]
name = "tokenizer"
harness = false
