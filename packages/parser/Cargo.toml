[package]
edition = "2021"
license = "MIT"
name = "postcss-rs-parser"
version = "0.1.0"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
postcss-rs-tokenizer = {path = "../tokenizer"}
serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0.59", features = ["preserve_order"]}
unicode-bom = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_test = "1.0.130"

[[bench]]
name = "parser"
harness = false

[features]
default = ["output"]
output = []
