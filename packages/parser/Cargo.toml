[package]
edition = "2021"
license = "MIT"
name = "postcss-rs-parser"
version = "0.1.0"

[dependencies]
postcss-rs-tokenizer = {path = "../tokenizer"}
regex = "1"
serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0.59", features = ["preserve_order"]}
unicode-bom = "1"

[dev-dependencies]
serde_test = "1.0.130"

[features]
default = ["output"]
output = []
