[package]
edition = "2021"
license = "MIT"
name = "postcss-rs-stringifier"
version = "0.1.0"

[dependencies]
postcss-rs-parser = {path = "../parser"}
serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0.59", features = ["preserve_order"]}

[dev-dependencies]
serde_test = "1.0.130"

[features]
default = ["output"]
output = []
