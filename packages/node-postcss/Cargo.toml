[package]
edition = "2018"
name = "postcss-rs-node-postcss"
version = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["compat-mode"] }
napi-derive = "3"
postcss-rs-parser = { path = "../parser" }
postcss-rs-stringifier = { path = "../stringifier" }
serde_json = "1.0"
sonic-rs   = "0.5"
flatbuffers = "24.3.25"
rmp-serde  = "1.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parse"
harness = false

[build-dependencies]
napi-build = "2"
