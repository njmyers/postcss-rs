[package]
edition = "2018"
name = "postcss-rs-node-postcss"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3" }
napi-derive = "3"
postcss-rs-parser = { path = "../parser" }
postcss-rs-stringifier = { path = "../stringifier" }
serde_json = "1.0"

[build-dependencies]
napi-build = "2"
