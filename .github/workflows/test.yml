on: [push]

name: Test

jobs:
  test:
    name: Test Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Download Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Test Code
        uses: actions-rs/cargo@v1
        with:
          command: test
