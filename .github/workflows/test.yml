on: [push]

name: Test

jobs:
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Test Rust
        run: cargo test --all-features

  test-node:
    name: Test Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Build native addon (node)
        working-directory: packages/node
        run: pnpm run build

      - name: Build native addon (node-postcss)
        working-directory: packages/node-postcss
        run: pnpm run build

      - name: Test Node
        run: pnpm test
